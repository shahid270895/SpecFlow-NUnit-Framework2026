name: Selenium SpecFlow Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, shahidQA]
  workflow_dispatch:
    inputs:
      executionMode:
        type: choice
        required: true
        default: Single
        options: [Single, CrossBrowser]
      browser:
        type: choice
        required: true
        default: Chrome
        options: [Chrome, Firefox, Edge]
      environment:
        type: choice
        required: true
        default: QA
        options: [QA, Staging, Production]
      testCategory:
        type: choice
        required: true
        default: Smoke
        options: [All, Smoke, Regression, Sanity]
      headless:
        type: choice
        required: true
        default: "true"
        options: ["true","false"]

concurrency:
  group: selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-browser:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.executionMode == 'Single'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with: {dotnet-version: 9.0.x}
    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-
    - run: dotnet restore SpecFlowAutomationFramework.csproj
    - run: dotnet build SpecFlowAutomationFramework.csproj --configuration Release --no-restore
    - name: Execute Tests
      shell: pwsh
      continue-on-error: true
      env:
        Browser: ${{ github.event.inputs.browser || 'Chrome' }}
        Environment: ${{ github.event.inputs.environment || 'QA' }}
        Headless: ${{ github.event.inputs.headless || 'true' }}
        TestCategory: ${{ github.event.inputs.testCategory || 'All' }}
      run: |
        if($env:TestCategory -eq "All"){
          dotnet test SpecFlowAutomationFramework.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"
        } else {
          dotnet test SpecFlowAutomationFramework.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx" --filter "Category=$env:TestCategory"
        }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TestResults-${{ github.run_number }}
        path: "**/*.trx"
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reports-${{ github.event.inputs.browser || 'Chrome' }}
        path: Reports/**
        if-no-files-found: warn

  cross-browser:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.executionMode == 'CrossBrowser'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [Chrome, Firefox, Edge]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with: {dotnet-version: 9.0.x}
    - run: dotnet restore SpecFlowAutomationFramework.csproj
    - run: dotnet build SpecFlowAutomationFramework.csproj --configuration Release --no-restore
    - name: Execute Tests
      shell: pwsh
      continue-on-error: true
      env:
        Browser: ${{ matrix.browser }}
        Environment: ${{ github.event.inputs.environment }}
        Headless: ${{ github.event.inputs.headless }}
        TestCategory: ${{ github.event.inputs.testCategory }}
      run: |
        if($env:TestCategory -eq "All"){
          dotnet test SpecFlowAutomationFramework.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults-$env:Browser.trx"
        } else {
          dotnet test SpecFlowAutomationFramework.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults-$env:Browser.trx" --filter "Category=$env:TestCategory"
        }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TestResults-${{ matrix.browser }}
        path: "**/*.trx"
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Reports-${{ matrix.browser }}
        path: Reports/**
        if-no-files-found: warn
